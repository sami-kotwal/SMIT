<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Contact-main">
        <h1 class="content-heading">Contact Form</h1>
        <form action="" method="post">

            <input type="text" class="name" id="cform" placeholder="Enter Your Name">
            <input type="email" class="name"  id="cform" placeholder="Enter Your Email">
            <input type="number" class="name"  id="cform"  placeholder="Enter Your Number">
            <textarea name="" id="cform" placeholder="Message"></textarea>
            <button type="submit" class="bform">Send Message</button>
            
        </form>
    </div>
</body>
</html>
